# Unit tests for the Python tooling under Tools/ (i18n gate, doc-comment lint, What's New generator,
# stale-branch pruner, protocol-doc reference checker).
#
# NO path filter on purpose: several suites assert on Android product source (test_home_i18n.py reads
# TodayScreen.kt and the strings.xml resources), so no path list describes their inputs.
name: Tools Python CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tools-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run core Tools/ tests
        run: |
          set -o pipefail   # GitHub's default shell is `bash -e` WITHOUT pipefail: piping into tee
          mapfile -t files < <(find . -maxdepth 1 -name 'test_*.py' -printf '%f\n' | sort)
          modules=("${files[@]%.py}")
          python3 -m unittest -v "${modules[@]}" 2>&1 | tee "$RUNNER_TEMP/out.txt"
          ran=$(grep -oE '^Ran [0-9]+ test' "$RUNNER_TEMP/out.txt" | grep -oE '[0-9]+')
          echo "collected ${ran:-0} tests"
          if [ "${ran:-0}" -lt 130 ]; then
            echo "::error::expected at least 130 core Tools tests, collected ${ran:-0} — discovery is broken, not the suite"
            exit 1
          fi
        working-directory: Tools
