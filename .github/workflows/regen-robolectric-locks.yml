# TEMPORARY: records the lockfile and verification-metadata entries for the Robolectric upgrade,
# because the authoring session cannot reach Google's Maven repository. Removed before merge.
name: Regenerate Robolectric locks (temporary)

on:
  push:
    branches: [claude/project-thread-3cd9z4]
    paths:
      - '.github/workflows/regen-robolectric-locks.yml'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - name: Write locks and verification metadata
        working-directory: android
        run: |
          set -o pipefail
          # Lock state is only written by a build that succeeds, so lock in its own invocation first.
          ./gradlew --no-daemon --write-locks --write-verification-metadata sha256 \
            :app:dependencies > "$RUNNER_TEMP/locks.log" 2>&1 || { tail -80 "$RUNNER_TEMP/locks.log"; exit 1; }
          ./gradlew --no-daemon --continue --write-verification-metadata sha256 \
            testFullDebugUnitTest testDemoDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/regen.log" || true
          git diff --stat
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regen-log
          path: |
            ${{ runner.temp }}/regen.log
            android/app/build/test-results/
      - name: Commit regenerated files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradle/verification-metadata.xml android/app/gradle.lockfile
          git commit -m "Record Robolectric 4.18.1 in the lockfile and verification metadata" || exit 0
          git push origin "HEAD:${{ github.ref_name }}"
