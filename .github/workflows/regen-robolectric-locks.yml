# TEMPORARY: records the lockfile and verification-metadata entries for the Robolectric and JaCoCo upgrade,
# because the authoring session cannot reach Google's Maven repository. Removed before merge.
name: Regenerate Robolectric locks (temporary)

on:
  push:
    branches: [claude/project-thread-3cd9z4]
    paths:
      - '.github/workflows/regen-robolectric-locks.yml'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - name: Write locks and verification metadata
        working-directory: android
        run: |
          set -o pipefail
          # Diagnose run: only the JaCoCo budget test, printing every cause in its stack trace.
          ./gradlew --no-daemon testFullDebugUnitTest \
            --tests 'com.noop.analytics.IntelligenceEngineJacocoBudgetTest' 2>&1 | tail -20 || true
          grep -rh -E 'Caused by|LimitExceeded|Exception:' app/build/test-results/ | sort -u | head -40 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regen-log
          path: |
            ${{ runner.temp }}/regen.log
            android/app/build/test-results/
      - name: Commit regenerated files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradle/verification-metadata.xml android/app/gradle.lockfile
          git commit -m "Record JaCoCo 0.8.16 in the lockfile and verification metadata" || exit 0
          git push origin "HEAD:${{ github.ref_name }}"
