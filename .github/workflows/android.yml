# Compile-and-test verification for the Android app.
#
# Debug build only, with unit tests. There is intentionally no signing config,
# no keystore, no secrets, and no artifact publishing here: release APKs are
# built and signed by hand. A debug build falls back to the Android debug key
# automatically, so this job needs nothing from the repository owner to pass.
name: Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew assembleFullDebug

      - name: Run unit tests
        run: ./gradlew testFullDebugUnitTest

      # On a failed run, keep the evidence: per-test output (including what a test printed) and Room's
      # schema export from this build, which a schema-format change has to be compared against.
      - name: Upload test reports and Room schema export
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/roomSchemaOracle/
          if-no-files-found: ignore
